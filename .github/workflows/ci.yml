name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shipment_tracker
          POSTGRES_PASSWORD: shipment_tracker
          POSTGRES_DB: shipment_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shipment_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://shipment_tracker:shipment_tracker@localhost:5432/shipment_tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:migrate:deploy -w apps/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
